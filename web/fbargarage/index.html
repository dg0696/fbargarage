<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F-Bar Garage</title>
  <style>
    :root { --bg:#141414; --panel:#1e1e1e; --text:#e8e8e8; --muted:#9a9a9a; --line:#333; --accent:#c4a35a; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    main { padding: 48px 24px; max-width: 560px; margin: 0 auto; }
    .card { background: var(--panel); border: 1px solid var(--line); padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); }
    a.btn { display: inline-block; margin-top: 8px; background: var(--accent); color: #141414; padding: 8px 14px; text-decoration: none; }
    a.btn:hover { text-decoration: none; opacity: 0.92; }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <h1>F-Bar Garage</h1>
      <p>eBay store inventory and listings. Not a public shop. The live app is FastAPI on port 5057.</p>
      <p><a class="btn" href="http://truenas.local:5057/">Open F-Bar Garage</a></p>
    </article>
  </main>
</body>
</html>
